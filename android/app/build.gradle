apply plugin: 'com.android.application'

// RevenueCat keys live in android/local.properties (gitignored), not in code:
//   revenuecat.testKey=test_...   (debug builds, RevenueCat's Test Store)
//   revenuecat.googleKey=goog_... (release builds, Google Play)
def rcProps = new Properties()
def rcFile = rootProject.file('local.properties')
if (rcFile.exists()) { rcFile.withInputStream { rcProps.load(it) } }

android {
    namespace = "com.mediocreatbest.gencare"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mediocreatbest.gencare"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Minutes since 1970: every build is numbered higher than the last one,
        // whether it was built on Anna's PC (build-gencare-aab.bat) or in
        // Codemagic, so Play never refuses an upload as "version code already used".
        versionCode((int) (System.currentTimeMillis() / 60000L))
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "RC_TEST_KEY", "\"${rcProps.getProperty('revenuecat.testKey', '')}\""
        buildConfigField "String", "RC_GOOGLE_KEY", "\"${rcProps.getProperty('revenuecat.googleKey', '')}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("../android/key.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS')
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
            storeFile keystorePropertiesFile.exists() ? file(keystoreProperties['storeFile']) : file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword keystoreProperties['storePassword'] ?: System.getenv('STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // R8 shrinking + obfuscation (the same setup as ADHDone and Happy Plants;
            // Play flags builds without it). Keep rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Push notifications (NotifyBridge). Pinned, same as ADHDone.
    implementation 'com.onesignal:OneSignal:5.9.9'
    // Google Play in-app updates: the update popup opens Play's own update screen in the app.
    implementation 'com.google.android.play:app-update:2.1.0'
    // Subscriptions (GenCare Family plan) through RevenueCat; 10.28.0 uses Play Billing 8.3.0.
    implementation 'com.revenuecat.purchases:purchases:10.28.0'
    // Background calendar import/export (CalendarSyncWorker).
    implementation 'androidx.work:work-runtime:2.9.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
