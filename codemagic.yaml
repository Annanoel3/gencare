# GenCare iPhone build on Codemagic (https://codemagic.io): compiles the iOS
# app on Apple hardware in the cloud, signs it with Anna's Apple Developer
# account, and uploads it to TestFlight. No Mac needed.
#
# One-time setup in Codemagic (details in the to-do list Claude wrote):
#   1. Add the GitHub repo Annanoel3/gencare as an application.
#   2. Teams > Integrations > App Store Connect: add the API key, name it "GenCare".
#   3. The app's Environment variables, group "gencare":
#        RC_APPLE_KEY           RevenueCat public iOS key (appl_...), secret
#        GENCARE_APP_STORE_ID   the numeric Apple ID of the app in App Store Connect (optional)
#
# Starting a build: the "Start new build" button, or a git tag that starts with
# "ios-" (e.g. ios-1). Base44's own pushes to main never start a build.
#
# Android (the same app for Google Play), workflow "android-play":
#   Codemagic > Teams > Code signing identities > Android keystores: upload
#   android/app/release.keystore from Anna's PC with its passwords, reference
#   name "gencare_keystore". Group "gencare" may also hold
#        RC_GOOGLE_KEY          RevenueCat public Android key (goog_...), secret
#   The build emails a link to the .aab, which goes into Play Console by hand
#   until Play publishing is wired up.
workflows:
  android-play:
    name: GenCare Android -> .aab for Google Play
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - gencare_keystore
      groups:
        - gencare
      node: 22
      java: 21
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'android-*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install web dependencies
        script: npm ci --no-audit --no-fund
      - name: Sync Capacitor (Android)
        script: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>GenCare</title>' > dist/index.html
          npx cap sync android
      - name: RevenueCat key into local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "revenuecat.googleKey=${RC_GOOGLE_KEY:-}" >> android/local.properties
      - name: Build the signed .aab
        script: |
          cd android
          chmod +x gradlew
          # app/build.gradle reads these when key.properties is absent (it stays on Anna's PC)
          export KEYSTORE_FILE="$CM_KEYSTORE_PATH"
          export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export KEY_ALIAS="$CM_KEY_ALIAS"
          export KEY_PASSWORD="$CM_KEY_PASSWORD"
          ./gradlew bundleRelease -PversionCode="$BUILD_NUMBER" --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - annanoelwenballew@gmail.com
        notify:
          success: true
          failure: true


  ios-testflight:
    name: GenCare iPhone -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: GenCare
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mediocreatbest.gencare
      groups:
        - gencare
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install web dependencies
        script: npm ci --no-audit --no-fund
      - name: Sync Capacitor (iOS)
        script: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>GenCare</title>' > dist/index.html
          npx cap sync ios
      - name: Put the secrets into Info.plist
        script: |
          plutil -replace RCAppleApiKey -string "${RC_APPLE_KEY:-}" ios/App/App/Info.plist
          plutil -replace GenCareAppStoreId -string "${GENCARE_APP_STORE_ID:-}" ios/App/App/Info.plist
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - annanoelwenballew@gmail.com
        notify:
          success: true
          failure: true
